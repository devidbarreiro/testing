<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-gray-900 text-white flex items-center justify-center min-h-screen">

    <div x-data="app()" class="text-center w-full max-w-2xl">
        <h1 class="text-4xl font-bold mb-8 text-blue-500">Generador de Píldoras IA</h1>
        
            <div class="mb-6 text-left">
                <label class="block text-gray-400 mb-2">Pegar Guión Completo:</label>
                <textarea 
                    x-model="script" 
                    rows="6" 
                    class="w-full bg-gray-700 text-white rounded p-4 text-sm"
                    placeholder="Escribe aquí tu guión... El sistema detectará los párrafos y generará las infografías automáticamente."></textarea>
            </div>

            <button 
                @click="generar" 
                :disabled="loading || !script"
                class="bg-blue-600 hover:bg-blue-500 px-8 py-3 rounded-lg font-bold text-lg transition disabled:opacity-50">
                <span x-show="!loading">Generar Video Completo</span>
                <span x-show="loading">Procesando (Puede tardar minutos)...</span>
            </button>

            <div x-show="error" class="mt-4 text-red-400" x-text="error"></div>

            <div x-show="videoUrl" class="mt-8 transition" x-transition>
                <h3 class="text-xl font-bold mb-2">Resultado:</h3>
                <video :src="videoUrl" controls autoplay class="w-full rounded border border-gray-600"></video>
            </div>
        </div>
    </div>

    <script>
        function app() {
            return {
                script: '',
                loading: false,
                videoUrl: null,
                error: null,
                async generar() {
                    this.loading = true;
                    this.error = null;
                    try {
                        const res = await fetch('/api/generar', { 
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({ script: this.script })
                        });
                        const data = await res.json();
                        if(data.status === 'ok') {
                            this.videoUrl = data.url + '?t=' + new Date().getTime(); // Cache buster
                        } else {
                            this.error = "Error en el servidor";
                        }
                    } catch(e) {
                        this.error = e.message;
                    } finally {
                        this.loading = false;
                    }
                }
            }
        }
    </script>
</body>
</html>
